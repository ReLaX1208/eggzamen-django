{% extends "layout/basic.html" %}



{% block title %}Изменение объявления{% endblock %}
{% block content %}
<h2>Изменение объявления</h2>
    <form method="post" enctype="multipart/form-data" class="loginform">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Изменить</button> |
        <input type="button" value="Отмена" class="btn btn-primary" onclick="window.history.back();" />
    </form>
{% endblock %}
